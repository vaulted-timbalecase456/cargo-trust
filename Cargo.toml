[package]
name = "cargo-trust"
version = "0.1.0"
edition = "2024"
authors = ["cargo-trust contributors"]
description = "Security-focused tool for auditing unsafe code in Rust projects"
repository = "https://github.com/JumpiiX/cargo-trust"
license = "MIT OR Apache-2.0"
keywords = ["cargo", "security", "unsafe", "audit", "tool"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "cargo-trust"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "color", "suggestions"] }
walkdir = "2.5"
colored = "2.1"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"